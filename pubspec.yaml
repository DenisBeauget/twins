name: twins_front
description: "twins app"
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ">=3.2.3 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  pretty_qr_code: ^3.3.0
  firebase_auth: ^4.19.5
  firebase_core: ^2.31.0
  cloud_firestore: ^4.17.3
  firebase_core_platform_interface: ^5.0.0
  carousel_slider_plus: ^6.0.0
  shared_preferences: ^2.2.3
  haptic_feedback: ^0.4.2
  flutter_bloc: ^7.3.0
  bloc: ^7.2.0
  equatable: ^2.0.5
  provider: ^6.1.2
  flutter_localizations:
    sdk: flutter
  intl: ^0.19.0
  firebase_storage: ^11.7.7
  image_picker: ^1.1.2
  flutter_native_image: ^0.0.6+1
  flutter_stripe: ^10.1.1
  flutter_dotenv: ^5.1.0
  http: ^1.2.1
  uni_links: ^0.5.1
  google_fonts: ^6.2.1
  confetti: ^0.7.0
  toastification: ^2.0.0
  flutter_spinkit: ^5.2.1
  fluentui_system_icons: ^1.1.246
  iconsax_plus: ^1.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/img/twins_logo.png
    - assets/img/twins_logo_w.png
    - assets/img/scroll.gif
    - assets/img/scroll_w.gif
    - assets/img/twins_logo_green.png
    - assets/img/twins_logo_green_full.png
    - assets/img/twins_logo_purple.png
    - assets/img/twins_logo_purple_full.png
    - .env
